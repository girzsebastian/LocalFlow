name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Test the portable core
        run: swift test

      - name: Build the app bundle
        run: ./build.sh

      - name: Verify the bundle
        run: |
          test -x build/Softspoke.app/Contents/MacOS/Softspoke
          plutil -lint build/Softspoke.app/Contents/Info.plist
          codesign --verify --verbose build/Softspoke.app

      - name: Package
        id: package
        run: |
          # The .dmg is the install people expect on a Mac: drag onto the
          # Applications shortcut. The script mounts what it built and verifies
          # the signature survived, so a broken image fails here, not on a
          # user's machine.
          ./scripts/package-dmg.sh
          mv build/Softspoke-*.dmg Softspoke-macOS-Apple-Silicon.dmg
          mv build/Softspoke-*.dmg.sha256 Softspoke-macOS-Apple-Silicon.dmg.sha256 || true
          shasum -a 256 Softspoke-macOS-Apple-Silicon.dmg \
            | tee Softspoke-macOS-Apple-Silicon.dmg.sha256

          # The zip stays for anyone scripting an install, and for the handful
          # of setups where mounting a disk image is awkward.
          # ditto preserves the bundle's signature and resource forks; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent \
            build/Softspoke.app Softspoke-macOS-Apple-Silicon.zip
          shasum -a 256 Softspoke-macOS-Apple-Silicon.zip \
            | tee Softspoke-macOS-Apple-Silicon.zip.sha256

          echo "sha=$(shasum -a 256 Softspoke-macOS-Apple-Silicon.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA256: ${{ steps.package.outputs.sha }}
        run: |
          gh release create "$TAG" \
            Softspoke-macOS-Apple-Silicon.dmg \
            Softspoke-macOS-Apple-Silicon.dmg.sha256 \
            Softspoke-macOS-Apple-Silicon.zip \
            Softspoke-macOS-Apple-Silicon.zip.sha256 \
            --title "Softspoke $TAG" \
            --generate-notes \
            --notes "SHA-256 (.dmg): \`$SHA256\`" \
            || gh release upload "$TAG" \
              Softspoke-macOS-Apple-Silicon.dmg \
              Softspoke-macOS-Apple-Silicon.dmg.sha256 \
              Softspoke-macOS-Apple-Silicon.zip \
              Softspoke-macOS-Apple-Silicon.zip.sha256 --clobber
