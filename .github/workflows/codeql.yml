name: CodeQL

# Static analysis of the Swift itself.
#
# Softspoke has no package dependencies, so dependency scanners have nothing to
# read. What it does have is code that holds an Accessibility grant, writes into
# other applications, shells out to local binaries and runs a localhost server —
# which is exactly the surface CodeQL is useful on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published queries reach existing code without a push.
    - cron: "31 4 * * 1"
  workflow_dispatch:

# Swift analysis has to build the app, so a run takes minutes on a macOS
# runner. Without this, every push stacks another one that nobody will read.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis has to build the code, so it needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-and-quality

      # Autobuild cannot guess our `xcrun swiftc` invocation, so build the way
      # the project actually builds.
      - name: Build for analysis
        run: ./build.sh

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
