name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Apple Silicon runner with the macOS 26 SDK the app targets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcrun swift --version

      # Needs no speech models, microphone, or network.
      - name: Test the portable core
        run: swift test

      - name: Build the app bundle
        run: ./build.sh

      - name: Verify the bundle
        run: |
          test -x build/LocalFlow.app/Contents/MacOS/LocalFlow
          plutil -lint build/LocalFlow.app/Contents/Info.plist
          codesign --verify --verbose build/LocalFlow.app

      # macOS keys the Accessibility grant on the bundle identifier together
      # with the signature's designated requirement. If the two drift apart,
      # every rebuild looks like a different app and the user has to re-grant
      # it — a failure nobody notices until they are mid-dictation.
      - name: Bundle identifier matches the signing requirement
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" Info.plist)
          script=$(grep -o 'identifier "[^"]*"' build.sh | sed 's/identifier "//; s/"//')
          signed=$(codesign -d -r- build/LocalFlow.app 2>&1 | grep -o 'identifier "[^"]*"' | sed 's/identifier "//; s/"//')
          echo "Info.plist: $plist"
          echo "build.sh:   $script"
          echo "signature:  $signed"
          test "$plist" = "$script" && test "$plist" = "$signed"

  core-windows:
    # LocalFlow has no Windows app yet. What this job proves is that the
    # portable half stays portable: the moment someone reaches for an Apple
    # framework inside Sources/Core, this build goes red on the pull request
    # rather than months later when a Windows port is attempted.
    name: Portable core on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Build the portable core
        run: swift build

      - name: Test the portable core
        run: swift test
