name: Feature request
description: Suggest something Softspoke should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation, not the solution. What does your current workflow look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like Softspoke to do
    validations:
      required: true
  - type: checkboxes
    id: local-first
    attributes:
      label: Local-first check
      description: >
        Softspoke's core promise is that speech audio never leaves the Mac
        without an explicit user action.
      options:
        - label: This can work without sending audio or transcripts off the machine, or it is opt-in and clearly marked.
          required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - label: I would be willing to open a pull request for this.
